# main에 올라온 코드를 Hugging Face Space로 복사한다 (Space가 앱을 다시 빌드·재시작).
# 필요한 설정: GitHub 저장소 Settings > Secrets and variables > Actions 에
#   secret HF_TOKEN (Hugging Face write 토큰), variable HF_SPACE (예: gbike-SCM/dashboard)
# HF_SPACE가 없으면 아무것도 하지 않는다.
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Push snapshot to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # Space는 이력 없는 스냅샷만 받는다 (docs의 이미지 같은 바이너리는 Space가 거부해서 뺀다)
          rm -rf .git docs .devcontainer
          cp hf/README.md README.md
          git init -q -b main
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "sync ${GITHUB_SHA::7}"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
