name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app to prevent it from sleeping
        run: |
          curl -sSL -c cookies.txt -b cookies.txt -o /dev/null -w "HTTP %{http_code}\n" --fail \
            "https://qpz9tpzwmnpoiz9dy7qf6f.streamlit.app/"
